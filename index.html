<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>اسم حيوان نبات جماد بلاد</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<meta name="theme-color" content="#fdf6ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">
<script>
(function () {
  var root = document.documentElement;
  var saved = localStorage.getItem("nap.theme");
  if (saved === "dark" || saved === "light") {
    root.setAttribute("data-theme", saved);
  } else if (window.matchMedia("(prefers-color-scheme: dark)").matches) {
    root.setAttribute("data-theme", "dark");
  }
  window.addEventListener("DOMContentLoaded", function () {
    var btn = document.getElementById("themeToggle");
    if (!btn) return;
    function updateThemeButton() {
      var dark = root.getAttribute("data-theme") === "dark";
      btn.setAttribute("aria-label", dark ? "تفعيل الوضع الفاتح" : "تفعيل الوضع الداكن");
      btn.setAttribute("title", dark ? "الوضع الفاتح" : "الوضع الداكن");
      btn.classList.toggle("is-dark", dark);
    }
    updateThemeButton();
    btn.onclick = function () {
      var current = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
      root.setAttribute("data-theme", current);
      localStorage.setItem("nap.theme", current);
      updateThemeButton();
    };
  });
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/reset.css?v=20260930">
<link rel="stylesheet" href="css/variables.css?v=20260930">
<link rel="stylesheet" href="css/style.css?v=20260930">
</head>
<body>
<div class="app" id="app">
  <div class="rings" aria-hidden="true">
    <span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span>
  </div>
  <div class="margin-line" aria-hidden="true"></div>
  <header class="top">
    <span class="brand">اسم • حيوان • نبات</span>
    <span class="round-badge hidden" id="roundBadge"></span>
    <button id="themeToggle" type="button" aria-label="تفعيل الوضع الداكن" title="الوضع الداكن">
      <span class="icon-sun" aria-hidden="true">☀</span>
      <span class="icon-moon" aria-hidden="true">☾</span>
    </button>
  </header>

  <main id="screen" role="main"></main>

  <footer class="credit">لعبة محلية — بدون إنترنت، بدون حسابات</footer>
</div>

<div id="modalRoot"></div>

<script src="js/normalization.js?v=20260929c"></script>

</html>
